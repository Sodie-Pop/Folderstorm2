[package]
name = "folderstorm-mcp-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Folderstorm2's local assistant bridge: loopback listener, token, discovery file, permission policy and wire protocol"

[dependencies]
folderstorm-brand = { path = "../folderstorm-brand" }
# The bearer token's bytes from the OS random source; MIT/Apache-2.0,
# already in the tree.
getrandom = "0.4.3"
# Constant-time token comparison; BSD-3-Clause, already in the tree.
subtle = "2.6.1"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
